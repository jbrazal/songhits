<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter&family=Montserrat&family=Nunito&family=Open+Sans&family=Roboto&display=swap" rel="stylesheet">
  <title>What A Girl Wants | SongHits</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0c0c0c;
      --surface: #111111;
      --border:  #222222;
      --text:    #cccccc;
      --muted:   #929292;
      --chord:   #fbbf24;
      --lyric:   #a6bac9;
      --section: #4ade80;
      --red:     #f87171;
      --blue:    #60a5fa;
      --nav-h:   44px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Verdana, Geneva, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 500;
      height: var(--nav-h);
      background: #080808;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 20px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .nav-brand { color: var(--red); font-weight: 700; letter-spacing: 0.06em; font-size: 14px; }
    nav a { color: var(--muted); }
    nav a:hover { color: var(--text); text-decoration: none; }

    /* ── chord-mark renderer output ─────────────────────────── */
    .cmSong {
      max-width: 900px;
      line-height: 1;
      font-family: var(--chart-font, 'Courier New', Courier, monospace);
    }
    .cmSection { margin-bottom: 1.2em; }

    .cmSectionLabel {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--section);
      margin: 0 0 5px;
      padding-bottom: 2px;
      border-bottom: 1px solid #282828;
    }
    .cmSectionMultiplier { color: #c678dd; font-weight: normal; }

    .cmTimeSignature,
    .cmKeyDeclaration { color: #56b6c2; font-weight: bold; margin-bottom: 4px; display: block; }

    .cmChordLine {
      display: block;
      white-space: pre;
      color: var(--chord);
      font-weight: 600;
      line-height: 1;
    }
    .cmChordSymbol { color: var(--chord); }
    .cmChordDuration { color: #555; font-weight: normal; font-size: 0.85em; }
    .cmBarSeparator { color: #333; opacity: 0.9; }
    .cmSubBeatGroupOpener,
    .cmSubBeatGroupCloser { color: #888; font-weight: bold; }

    .cmLyricLine {
      display: block;
      white-space: pre;
      color: var(--lyric);
      line-height: 1;
    }
    .cmLyric { display: inline; }

    .cmNoChord { color: var(--muted); font-style: italic; }
    .cmEmptyLine { display: block; height: 0.55em; }

    /* ── Shared button/control styles ───────────────────────── */
    .ctrl-btn {
      background: #1e1e1e;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 4px;
      width: 26px;
      height: 26px;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
      transition: background 0.1s;
    }
    .ctrl-btn:hover { background: #2a2a2a; color: #fff; }
    .ctrl-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      flex-shrink: 0;
    }
    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }
    .pref-select {
      background: #1e1e1e;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 11px;
      height: 26px;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }
    .pref-select:hover, .pref-select:focus { background: #2a2a2a; color: #fff; }

    /* ── Tempo blinker ──────────────────────────────────────── */
    @keyframes tempo-pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(0.38); }
    }
    #tempo-blinker {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--chord);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.4s;
      animation: tempo-pulse 0.5s ease-in-out infinite;
      animation-play-state: paused;
    }
    #tempo-blinker.active {
      opacity: 1;
      animation-play-state: running;
    }

    /* ── Display modes (charts render in full; CSS filters) ─── */
    [data-mode="lyrics"] .cmLine--chord { display: none; }
    [data-mode="chords"] .cmLine--lyric { display: none; }
    [data-mode="chordsFirstLyricLine"] .cmLine--lyric:not(.cmLine--firstLyric) { display: none; }

    /* ── Annotations: > cue, >role cue, ! shout, // note ────── */
    .cmAnno {
      display: flex;
      align-items: baseline;
      gap: 0.5em;
      margin-block: 0.35em;
      padding-inline-start: 0.6em;
      border-inline-start: 0.15em solid currentColor;
      font-size: 0.85em;
      line-height: 1.3;
    }
    .cmAnno--cue   { color: var(--muted); font-style: italic; }
    .cmAnno--shout { color: var(--chord); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .cmAnno--note  { color: #6b7280; font-size: 0.78em; display: none; }
    [data-notes="on"] .cmAnno--note { display: flex; }
    .cmAnnoRole { flex: none; font-variant: all-small-caps; font-weight: 600; letter-spacing: 0.06em; opacity: 0.85; }
    .cmAnnoChip { flex: none; padding-inline: 0.35em; border: 1px solid currentColor; border-radius: 0.2em; font-size: 0.85em; font-variant-numeric: tabular-nums; }
    .view-switcher { display: inline-flex; gap: 4px; }
    .view-switcher button[aria-pressed="true"], #btn-notes.active { background: var(--section); color: #000; border-color: var(--section); }

    /* ── Autoscroll playhead ───────────────────────────────── */
    .cmLine.cm-playhead { position: relative; background: rgba(74, 222, 128, 0.07); }
    .cmLine.cm-playhead::before {
      content: ''; position: absolute; left: -10px; top: 0; bottom: 0;
      width: 3px; border-radius: 2px; background: var(--section);
    }
    /* ── Teleprompter mode (page bars are hidden in each layout's own styles) ── */
    body.prompter { --nav-h: 0px; }
    body.prompter nav { display: none; }
    body.prompter .cmSong { max-width: none; line-height: 1.15; }
    body.prompter .cmChordLine, body.prompter .cmLyricLine { line-height: 1.15; }
    body.prompter .cmSectionLabel { font-size: 0.6em; margin-bottom: 0.3em; }
    body.prompter .cmEmptyLine { height: 0.35em; }
    #prompter-bar {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10000; gap: 10px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(8, 8, 8, 0.82);
      backdrop-filter: blur(6px); border-top: 1px solid #1e1e1e;
    }
    body.prompter #prompter-bar { display: flex; align-items: center; }
    .prompter-btn {
      min-height: 52px; min-width: 64px; padding: 0 16px; font-size: 18px; font-weight: 700; border-radius: 8px;
      border: 1px solid #333; background: #1e1e1e; color: #ddd; cursor: pointer; touch-action: manipulation;
    }
    .prompter-play { background: var(--section); color: #000; border: none; flex: 1; }
    .prompter-play.playing { background: var(--red); }
    .prompter-exit { margin-left: auto; }
    button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    button:disabled { opacity: 0.45; cursor: default; }
    @media print {
      :root { --bg: #fff; --text: #111; --muted: #444; --chord: #111; --lyric: #111; --section: #222; --red: #111; }
      body { background: #fff; color: #111; }
      .cmBarSeparator { color: #555; opacity: 1; }
      .cmChordDuration { color: #444; }
      .cmLyricLine { white-space: pre-wrap; }
      .cmAnno--note { display: none !important; }
      .cmAnno { break-inside: avoid; }
      .cmAnno--cue { color: #555; }
      .cmAnno--shout { color: #000; }
    }
  </style>
</head>

<style>

  }
  #song-toolbar .song-heading {

  }
  #song-toolbar .song-heading strong { color: #e8e8e8; font-size: 14px; }

  #transpose-val {

  .ctrl-btn-wide {

  #song-body {
    padding: 28px 32px calc(var(--scroll-h, 50px) + 24px);

  }
  #cm-error {
    background: #3a1010;
    border: 1px solid #7a3030;
    color: #f48771;
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    white-space: pre-wrap;
  }
  #cm-raw {
    white-space: pre-wrap;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  /* ── Docked controls ──────────────────────────────────────── */
  #scroll-controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: #0a0a0a;
    border-top: 1px solid #1e1e1e;
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 9999;
    font-size: 13px;
  }

  #btn-play {
    background: var(--section);
    color: #000;
    border: none;
    padding: 5px 16px;

    transition: background 0.12s;

  }
  #btn-play.playing { background: var(--red); }

  #speed-slider { width: 88px; accent-color: var(--chord); cursor: pointer; }
  #speed-val    { color: var(--chord); font-weight: 700; font-family: monospace; min-width: 2.6em; flex-shrink: 0; white-space: nowrap; }

  #btn-top {
    margin-left: auto;
    background: none;
    border: 1px solid #222;
    color: #444;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    flex-shrink: 0;
  }
  #btn-top:hover { background: #181818; color: #aaa; }

  .zoom-val {
    color: var(--chord);
    font-weight: 700;
    font-family: monospace;
    font-size: 12px;
    min-width: 3em;
    text-align: center;
    flex-shrink: 0;
  }

  @media (max-width: 1100px) {
    #song-toolbar { flex-wrap: wrap; height: auto; }
    #song-toolbar .song-heading { min-width: 12em; }
  }
  @media (max-width: 760px) {
    #song-toolbar, #scroll-controls { flex-wrap: wrap; height: auto; padding: 7px 10px; gap: 6px; }
    #song-toolbar .song-heading { flex: 1 0 100%; }
    .ctrl-label, .toolbar-sep { display: none; }
    #song-body { padding-left: 12px; padding-right: 12px; overflow-x: auto; }
    .ctrl-btn { width: 32px; height: 32px; }
  }
  /* ── Teleprompter mode ────────────────────────────────────── */
  body.prompter #song-toolbar, body.prompter #scroll-controls { display: none; }
  body.prompter #song-body { max-width: none; padding: 16px 20px 60vh; overflow-x: auto; }
  @media print {
    nav, #song-toolbar, #scroll-controls, #prompter-bar { display: none; }
    #song-body { padding: 0; }
    .cmSection { page-break-inside: avoid; }
    @page { margin: 1.5cm 2cm; size: A4 portrait; }
  }
</style>
