<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1110">
  <title>FLE-2026-10-03 | SongHits</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0c0c0c;
      --surface: #111111;
      --border:  #222222;
      --text:    #cccccc;
      --muted:   #929292;
      --chord:   #fbbf24;
      --lyric:   #a6bac9;
      --section: #4ade80;
      --red:     #f87171;
      --blue:    #60a5fa;
      --nav-h:   44px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Verdana, Geneva, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 500;
      height: var(--nav-h);
      background: #080808;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 20px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .nav-brand { color: var(--red); font-weight: 700; letter-spacing: 0.06em; font-size: 14px; }
    nav a { color: var(--muted); }
    nav a:hover { color: var(--text); text-decoration: none; }

    /* ── chord-mark renderer output ─────────────────────────── */
    .cmSong {
      max-width: 900px;
      line-height: 1;
      font-family: var(--chart-font, 'Courier New', Courier, monospace);
    }
    .cmSection { margin-bottom: 1.2em; }

    .cmSectionLabel {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--section);
      margin: 0 0 5px;
      padding-bottom: 2px;
      border-bottom: 1px solid #282828;
    }
    .cmSectionMultiplier { color: #c678dd; font-weight: normal; }

    .cmTimeSignature,
    .cmKeyDeclaration { color: #56b6c2; font-weight: bold; margin-bottom: 4px; display: block; }

    .cmChordLine {
      display: block;
      white-space: pre;
      color: var(--chord);
      font-weight: 600;
      line-height: 1;
    }
    .cmChordSymbol { color: var(--chord); }
    .cmChordDuration { color: #555; font-weight: normal; font-size: 0.85em; }
    .cmBarSeparator { color: #333; opacity: 0.9; }
    .cmSubBeatGroupOpener,
    .cmSubBeatGroupCloser { color: #888; font-weight: bold; }

    .cmLyricLine {
      display: block;
      white-space: pre;
      color: var(--lyric);
      line-height: 1;
    }
    .cmLyric { display: inline; }

    .cmNoChord { color: var(--muted); font-style: italic; }
    .cmEmptyLine { display: block; height: 0.55em; }

    /* ── Shared button/control styles ───────────────────────── */
    .ctrl-btn {
      background: #1e1e1e;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 4px;
      width: 26px;
      height: 26px;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
      transition: background 0.1s;
    }
    .ctrl-btn:hover { background: #2a2a2a; color: #fff; }
    .ctrl-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      flex-shrink: 0;
    }
    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }
    .pref-select {
      background: #1e1e1e;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 11px;
      height: 26px;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }
    .pref-select:hover, .pref-select:focus { background: #2a2a2a; color: #fff; }

    /* ── Tempo blinker ──────────────────────────────────────── */
    @keyframes tempo-pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(0.38); }
    }
    #tempo-blinker {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--chord);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.4s;
      animation: tempo-pulse 0.5s ease-in-out infinite;
      animation-play-state: paused;
    }
    #tempo-blinker.active {
      opacity: 1;
      animation-play-state: running;
    }

    /* ── Display modes (charts render in full; CSS filters) ─── */
    [data-mode="lyrics"] .cmLine--chord { display: none; }
    [data-mode="chords"] .cmLine--lyric { display: none; }
    [data-mode="chordsFirstLyricLine"] .cmLine--lyric:not(.cmLine--firstLyric) { display: none; }

    /* ── Annotations: > cue, >role cue, ! shout, // note ────── */
    .cmAnno {
      display: flex;
      align-items: baseline;
      gap: 0.5em;
      margin-block: 0.35em;
      padding-inline-start: 0.6em;
      border-inline-start: 0.15em solid currentColor;
      font-size: 0.85em;
      line-height: 1.3;
    }
    .cmAnno--cue   { color: var(--muted); font-style: italic; }
    .cmAnno--shout { color: var(--chord); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .cmAnno--note  { color: #6b7280; font-size: 0.78em; display: none; }
    [data-notes="on"] .cmAnno--note { display: flex; }
    .cmAnnoRole { flex: none; font-variant: all-small-caps; font-weight: 600; letter-spacing: 0.06em; opacity: 0.85; }
    .cmAnnoChip { flex: none; padding-inline: 0.35em; border: 1px solid currentColor; border-radius: 0.2em; font-size: 0.85em; font-variant-numeric: tabular-nums; }
    .view-switcher { display: inline-flex; gap: 4px; }
    .view-switcher button[aria-pressed="true"], #btn-notes.active { background: var(--section); color: #000; border-color: var(--section); }

    /* ── Autoscroll playhead ───────────────────────────────── */
    .cmLine.cm-playhead { position: relative; background: rgba(74, 222, 128, 0.07); }
    .cmLine.cm-playhead::before {
      content: ''; position: absolute; left: -10px; top: 0; bottom: 0;
      width: 3px; border-radius: 2px; background: var(--section);
    }
    /* ── Teleprompter mode (page bars are hidden in each layout's own styles) ── */
    body.prompter { --nav-h: 0px; }
    body.prompter nav { display: none; }
    body.prompter .cmSong { max-width: none; line-height: 1.25; }
    body.prompter .cmChordLine, body.prompter .cmLyricLine { line-height: 1.25; }
    body.prompter .cmSectionLabel { font-size: 0.75em; margin-bottom: 0.4em; }
    body.prompter .cmEmptyLine { height: 0.35em; }
    #prompter-bar {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10000; gap: 8px;
      flex-direction: column;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(8, 8, 8, 0.82);
      backdrop-filter: blur(6px); border-top: 1px solid #1e1e1e;
    }
    body.prompter #prompter-bar { display: flex; align-items: center; }
    .prompter-row { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 900px; }
    .prompter-row-tools { justify-content: flex-end; }
    .prompter-pace { color: var(--muted); font-size: 13px; font-weight: 700; }
    #prompter-speed-slider { flex: 1; min-width: 0; height: 44px; accent-color: var(--section); touch-action: manipulation; }
    #prompter-speed-val { min-width: 3.2em; color: var(--section); font: 700 15px ui-monospace, monospace; text-align: right; }
    .prompter-hint { color: var(--muted); font-size: 12px; margin-right: auto; }
    .prompter-btn {
      min-height: 52px; min-width: 64px; padding: 0 16px; font-size: 18px; font-weight: 700; border-radius: 8px;
      border: 1px solid #333; background: #1e1e1e; color: #ddd; cursor: pointer; touch-action: manipulation;
    }
    .prompter-play { background: var(--section); color: #000; border: none; flex: 1; }
    .prompter-play.playing { background: var(--red); }
    .prompter-exit { margin-left: auto; }
    @media (max-width: 680px) {
      body.prompter .cmSong { font-family: ui-monospace, 'Courier New', monospace; }
      body.prompter .cmLine { overflow: visible; }
      body.prompter .cmSection { margin-bottom: 1.5em; }
      body.prompter .cmAnno--cue { white-space: normal; line-height: 1.4; }
      .prompter-btn { min-height: 48px; min-width: 52px; padding: 0 11px; font-size: 16px; }
      .prompter-play { min-width: 92px; }
      .prompter-hint { font-size: 11px; }
    }
    button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    button:disabled { opacity: 0.45; cursor: default; }
    @media print {
      :root { --bg: #fff; --text: #111; --muted: #444; --chord: #111; --lyric: #111; --section: #222; --red: #111; }
      body { background: #fff; color: #111; }
      .cmBarSeparator { color: #555; opacity: 1; }
      .cmChordDuration { color: #444; }
      .cmLyricLine { white-space: pre-wrap; }
      .cmAnno--note { display: none !important; }
      .cmAnno { break-inside: avoid; }
      .cmAnno--cue { color: #555; }
      .cmAnno--shout { color: #000; }
    }
  </style>

</head>

 <a href="/songhits/" aria-label="SongHits home"><span class="nav-brand">SongHits</span></a>

<style>
  /* ── Layout ───────────────────────────────────────────────── */
  :root { --toc-w: 210px; --ctrl-h: 48px; }

  /* ── Controls bar – fixed below nav ──────────────────────── */
  #controls {
    position: fixed;
    top: var(--nav-h);
    left: 0;
    right: 0;
    height: var(--ctrl-h);
    background: #0a0a0a;
    border-bottom: 1px solid #1e1e1e;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 9999;
    font-size: 13px;
  }

  /* ── TOC toggle button ───────────────────────────────────── */
  #btn-toc {
    background: none;
    border: 1px solid #1e1e1e;
    color: #555;
    padding: 4px 9px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.1s, border-color 0.1s, background 0.1s;
  }
  #btn-toc:hover { background: #181818; color: #aaa; border-color: #333; }
  #btn-toc.active { color: var(--chord); border-color: #333; }

  #btn-toggle {
    background: var(--section);
    color: #000;
    border: none;
    padding: 5px 16px;
    border-radius: 5px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    min-width: 86px;
    transition: background 0.12s;
    flex-shrink: 0;
  }
  #btn-toggle.playing { background: var(--red); }

  #speed-slider { width: 88px; accent-color: var(--chord); cursor: pointer; }
  #speed-val    { color: var(--chord); font-weight: 700; font-family: monospace; min-width: 2.6em; flex-shrink: 0; white-space: nowrap; }

  #btn-top {
    margin-left: auto;
    background: none;
    border: 1px solid #222;
    color: #444;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    flex-shrink: 0;
  }
  #btn-top:hover { background: #181818; color: #aaa; }

  .zoom-val {
    color: var(--chord);
    font-weight: 700;
    font-family: monospace;
    font-size: 12px;
    min-width: 3em;
    text-align: center;
    flex-shrink: 0;
  }

  /* ── TOC sidebar ──────────────────────────────────────────── */
  #toc-sidebar {
    position: fixed;
    top: calc(var(--nav-h) + var(--ctrl-h));
    left: 0;
    width: var(--toc-w);
    bottom: 0;
    overflow-y: auto;
    background: #080808;
    border-right: 1px solid #1a1a1a;
    padding: 14px 0;
    z-index: 100;
    scrollbar-width: thin;
    scrollbar-color: #222 transparent;
    transition: transform 0.2s ease;
  }
  #toc-sidebar::-webkit-scrollbar { width: 4px; }
  #toc-sidebar::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

  .toc-part-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #333;
    padding: 10px 14px 4px;
  }
  .toc-part-label:first-child { padding-top: 2px; }

  #toc-sidebar ul { list-style: none; counter-reset: toc-n; }
  #toc-sidebar li { counter-increment: toc-n; }
  #toc-sidebar a,
  #toc-sidebar .toc-tbd {
    display: block;
    padding: 3px 14px 3px 10px;
    font-size: 12px;
    line-height: 1.35;
    color: #444;
    text-decoration: none;
    border-left: 2px solid transparent;
    transition: color 0.1s, border-color 0.1s;
  }
  #toc-sidebar a::before,
  #toc-sidebar .toc-tbd::before {
    content: counter(toc-n) ". ";
    font-size: 10px;
    color: #2a2a2a;
    margin-right: 2px;
  }
  #toc-sidebar a:hover { color: #888; text-decoration: none; }
  #toc-sidebar a.active { color: var(--chord); border-left-color: var(--chord); }
  #toc-sidebar .toc-tbd { color: #2a2a2a; font-style: italic; }

  /* Desktop: collapse TOC */
  body.toc-off #toc-sidebar { transform: translateX(-100%); pointer-events: none; }
  body.toc-off #setlist-wrap { margin-left: 0; }

  /* ── Mobile overlay backdrop ─────────────────────────────── */
  #toc-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 150;
    cursor: pointer;
  }

  /* ── Main content ─────────────────────────────────────────── */
  #setlist-wrap {
    margin-left: var(--toc-w);
    padding: calc(var(--ctrl-h) + 20px) 40px 60px 32px;
    font-size: 14px;
    transition: margin-left 0.2s ease;
  }

  .setlist-title {
    color: var(--red);
    font-size: 1.4em;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 28px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--red);
  }
  .setlist-backing-track { margin: -14px 0 28px; max-width: 520px; }
  .setlist-backing-track p { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .setlist-backing-track audio { display: block; width: 100%; }
  .setlist-backing-track a { color: var(--section); font-size: 12px; }
  .mobile-stage-entry { display: none; }
  .mobile-stage-entry button {
    width: 100%; min-height: 52px; border: 0; border-radius: 10px;
    background: var(--section); color: #06120a; font-size: 17px; font-weight: 800;
    touch-action: manipulation;
  }
  .mobile-stage-entry p { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .song-block { margin-bottom: 48px; }
  .song-block-header {
    position: sticky;
    top: calc(var(--nav-h) + var(--ctrl-h));
    z-index: 40;
    background: var(--bg);
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .song-block-title  { color: var(--red); font-size: 1.05em; font-weight: 700; }
  .song-block-artist { color: var(--muted); font-size: 12px; }

  .chart-pending    { color: #333; font-style: italic; font-size: 13px; padding: 8px 0; }
  .cm-raw-fallback  { white-space: pre-wrap; color: var(--muted); font-size: 13px; }

  /* ── Narrow screens ───────────────────────────────────────── */
  @media (max-width: 680px) {
    :root { --ctrl-h: 84px; }

    body { overflow-x: hidden; }

    #controls {
      flex-wrap: wrap;
      height: auto;
      padding: 7px 10px;
      gap: 5px;
      align-content: center;
    }
    .ctrl-label { display: none; }
    .toolbar-sep { display: none; }
    #btn-toggle { min-width: 72px; font-size: 12px; padding: 5px 10px; }
    #speed-slider { width: 70px; }
    #speed-val { min-width: 2.2em; font-size: 12px; }
    .zoom-val { min-width: 2.6em; font-size: 12px; }
    .ctrl-btn { width: 32px; height: 32px; font-size: 13px; }

    /* TOC as slide-in overlay drawer */
    #toc-sidebar {
      width: 75%;
      max-width: 260px;
      transform: translateX(-100%);
      z-index: 200;
      box-shadow: 4px 0 20px rgba(0,0,0,0.7);
    }
    body.toc-on #toc-sidebar { transform: translateX(0); pointer-events: auto; }
    body.toc-on #toc-overlay { display: block; }

    #setlist-wrap {
      margin-left: 0;
      padding: calc(var(--ctrl-h) + 12px) 14px 40px;
    }
    body.toc-off #setlist-wrap { margin-left: 0; }

    .cm-song-content { overflow-x: auto; }
    .mobile-stage-entry { display: block; margin: -12px 0 24px; }
  }

  .transpose-control { font-size: 12px; color: var(--text); margin-left: auto; }
  #offline-status { font-size: 11px; }
  .ctrl-btn-wide { width: auto; padding: 0 8px; }
  #controls { flex-wrap: wrap; height: auto; min-height: 48px; padding-top: 7px; padding-bottom: 7px; }
  .song-block-header { flex-wrap: wrap; }
  .song-block { scroll-margin-top: calc(var(--nav-h) + var(--ctrl-h) + 12px); }
  /* ── Teleprompter mode (after the toc-on rules so the overlay stays hidden) ── */
  body.prompter #controls, body.prompter #toc-sidebar, body.prompter #toc-overlay, body.prompter .transpose-control { display: none; }
  body.prompter #setlist-wrap { margin-left: 0; padding: 16px 20px 60vh; }
  body.prompter .song-block-header { position: static; margin-bottom: 16px; }
  body.prompter .setlist-title { font-size: 20px; margin-bottom: 16px; }
  body.prompter .setlist-backing-track { display: none; }
  body.prompter .song-block-title { font-size: 26px; }
  body.prompter .song-block-artist { font-size: 16px; }
  body.prompter .song-block { scroll-margin-top: 12px; }
  body.prompter .cm-song-content { overflow-x: auto; }
  body.prompter .mobile-stage-entry { display: none; }
  @media (max-width: 680px) {
    body.prompter #setlist-wrap { padding: 12px 12px 60vh; }
    body.prompter .song-block-header { position: sticky; top: 0; z-index: 50; background: var(--bg); padding: 8px 0; }
    body.prompter .song-block-title { font-size: 20px; }
    body.prompter .song-block-artist { display: none; }
    body.prompter .cm-song-content { overflow-x: auto; overscroll-behavior-x: contain; }
  }
  /* ── Print ────────────────────────────────────────────────── */
  @media print {
    nav, #toc-sidebar, #controls, #toc-overlay, .transpose-control, #prompter-bar { display: none !important; }
    #setlist-wrap { margin: 0; padding: 0; }
    .song-block { page-break-inside: avoid; }
    @page { margin: 1.5cm 2cm; size: A4 portrait; }
  }
</style>
