<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter&family=Montserrat&family=Nunito&family=Open+Sans&family=Roboto&display=swap" rel="stylesheet">
  <title>May Landicho | SongHits</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0c0c0c;
      --surface: #111111;
      --border:  #222222;
      --text:    #cccccc;
      --muted:   #929292;
      --chord:   #fbbf24;
      --lyric:   #a6bac9;
      --section: #4ade80;
      --red:     #f87171;
      --blue:    #60a5fa;
      --nav-h:   44px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Verdana, Geneva, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 500;
      height: var(--nav-h);
      background: #080808;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 20px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .nav-brand { color: var(--red); font-weight: 700; letter-spacing: 0.06em; font-size: 14px; }
    nav a { color: var(--muted); }
    nav a:hover { color: var(--text); text-decoration: none; }

    /* ── chord-mark renderer output ─────────────────────────── */
    .cmSong {
      max-width: 900px;
      line-height: 1;
      font-family: var(--chart-font, 'Courier New', Courier, monospace);
    }
    .cmSection { margin-bottom: 1.2em; }

    .cmSectionLabel {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--section);
      margin: 0 0 5px;
      padding-bottom: 2px;
      border-bottom: 1px solid #282828;
    }
    .cmSectionMultiplier { color: #c678dd; font-weight: normal; }

    .cmTimeSignature,
    .cmKeyDeclaration { color: #56b6c2; font-weight: bold; margin-bottom: 4px; display: block; }

    .cmChordLine {
      display: block;
      white-space: pre;
      color: var(--chord);
      font-weight: 600;
      line-height: 1;
    }
    .cmChordSymbol { color: var(--chord); }
    .cmChordDuration { color: #555; font-weight: normal; font-size: 0.85em; }
    .cmBarSeparator { color: #333; opacity: 0.9; }
    .cmSubBeatGroupOpener,
    .cmSubBeatGroupCloser { color: #888; font-weight: bold; }

    .cmLyricLine {
      display: block;
      white-space: pre;
      color: var(--lyric);
      line-height: 1;
    }
    .cmLyric { display: inline; }

    .cmNoChord { color: var(--muted); font-style: italic; }
    .cmEmptyLine { display: block; height: 0.55em; }

    /* ── Shared button/control styles ───────────────────────── */
    .ctrl-btn {
      background: #1e1e1e;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 4px;
      width: 26px;
      height: 26px;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
      transition: background 0.1s;
    }
    .ctrl-btn:hover { background: #2a2a2a; color: #fff; }
    .ctrl-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      flex-shrink: 0;
    }
    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }
    .pref-select {
      background: #1e1e1e;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 11px;
      height: 26px;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }
    .pref-select:hover, .pref-select:focus { background: #2a2a2a; color: #fff; }

    /* ── Tempo blinker ──────────────────────────────────────── */
    @keyframes tempo-pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(0.38); }
    }
    #tempo-blinker {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--chord);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.4s;
      animation: tempo-pulse 0.5s ease-in-out infinite;
      animation-play-state: paused;
    }
    #tempo-blinker.active {
      opacity: 1;
      animation-play-state: running;
    }
    button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    button:disabled { opacity: 0.45; cursor: default; }
    @media print {
      :root { --bg: #fff; --text: #111; --muted: #444; --chord: #111; --lyric: #111; --section: #222; --red: #111; }
      body { background: #fff; color: #111; }
      .cmBarSeparator { color: #555; opacity: 1; }
      .cmChordDuration { color: #444; }
      .cmLyricLine { white-space: pre-wrap; }
    }
  </style>
</head>
<body>
<nav>
 <a href="/songhits/"> <span class="nav-brand">SongHits</span></a>
  <a href="/songhits/songs/">Songs</a>
  <a href="/songhits/setlist/">Setlists</a>
</nav>
<style>
  /* ── Layout ───────────────────────────────────────────────── */
  :root { --toc-w: 210px; --ctrl-h: 48px; }

  /* ── Controls bar – fixed below nav ──────────────────────── */
  #controls {
    position: fixed;
    top: var(--nav-h);
    left: 0;
    right: 0;
    height: var(--ctrl-h);
    background: #0a0a0a;
    border-bottom: 1px solid #1e1e1e;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 9999;
    font-size: 13px;
  }

  /* ── TOC toggle button ───────────────────────────────────── */
  #btn-toc {
    background: none;
    border: 1px solid #1e1e1e;
    color: #555;
    padding: 4px 9px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.1s, border-color 0.1s, background 0.1s;
  }
  #btn-toc:hover { background: #181818; color: #aaa; border-color: #333; }
  #btn-toc.active { color: var(--chord); border-color: #333; }

  #btn-toggle {
    background: var(--section);
    color: #000;
    border: none;
    padding: 5px 16px;
    border-radius: 5px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    min-width: 86px;
    transition: background 0.12s;
    flex-shrink: 0;
  }
  #btn-toggle.playing { background: var(--red); }

  #speed-slider { width: 88px; accent-color: var(--chord); cursor: pointer; }
  #speed-val    { color: var(--chord); font-weight: 700; font-family: monospace; min-width: 2.6em; flex-shrink: 0; }

  #btn-top {
    margin-left: auto;
    background: none;
    border: 1px solid #222;
    color: #444;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    flex-shrink: 0;
  }
  #btn-top:hover { background: #181818; color: #aaa; }

  .zoom-val {
    color: var(--chord);
    font-weight: 700;
    font-family: monospace;
    font-size: 12px;
    min-width: 3em;
    text-align: center;
    flex-shrink: 0;
  }

  /* ── TOC sidebar ──────────────────────────────────────────── */
  #toc-sidebar {
    position: fixed;
    top: calc(var(--nav-h) + var(--ctrl-h));
    left: 0;
    width: var(--toc-w);
    bottom: 0;
    overflow-y: auto;
    background: #080808;
    border-right: 1px solid #1a1a1a;
    padding: 14px 0;
    z-index: 100;
    scrollbar-width: thin;
    scrollbar-color: #222 transparent;
    transition: transform 0.2s ease;
  }
  #toc-sidebar::-webkit-scrollbar { width: 4px; }
  #toc-sidebar::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

  .toc-part-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #333;
    padding: 10px 14px 4px;
  }
  .toc-part-label:first-child { padding-top: 2px; }

  #toc-sidebar ul { list-style: none; counter-reset: toc-n; }
  #toc-sidebar li { counter-increment: toc-n; }
  #toc-sidebar a,
  #toc-sidebar .toc-tbd {
    display: block;
    padding: 3px 14px 3px 10px;
    font-size: 12px;
    line-height: 1.35;
    color: #444;
    text-decoration: none;
    border-left: 2px solid transparent;
    transition: color 0.1s, border-color 0.1s;
  }
  #toc-sidebar a::before,
  #toc-sidebar .toc-tbd::before {
    content: counter(toc-n) ". ";
    font-size: 10px;
    color: #2a2a2a;
    margin-right: 2px;
  }
  #toc-sidebar a:hover { color: #888; text-decoration: none; }
  #toc-sidebar a.active { color: var(--chord); border-left-color: var(--chord); }
  #toc-sidebar .toc-tbd { color: #2a2a2a; font-style: italic; }

  /* Desktop: collapse TOC */
  body.toc-off #toc-sidebar { transform: translateX(-100%); pointer-events: none; }
  body.toc-off #setlist-wrap { margin-left: 0; }

  /* ── Mobile overlay backdrop ─────────────────────────────── */
  #toc-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 150;
    cursor: pointer;
  }

  /* ── Main content ─────────────────────────────────────────── */
  #setlist-wrap {
    margin-left: var(--toc-w);
    padding: calc(var(--ctrl-h) + 20px) 40px 60px 32px;
    font-size: 14px;
    transition: margin-left 0.2s ease;
  }

  .setlist-title {
    color: var(--red);
    font-size: 1.4em;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 28px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--red);
  }

  .song-block { margin-bottom: 48px; }
  .song-block-header {
    position: sticky;
    top: calc(var(--nav-h) + var(--ctrl-h));
    z-index: 40;
    background: var(--bg);
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .song-block-title  { color: var(--red); font-size: 1.05em; font-weight: 700; }
  .song-block-artist { color: var(--muted); font-size: 12px; }

  .chart-pending    { color: #333; font-style: italic; font-size: 13px; padding: 8px 0; }
  .cm-raw-fallback  { white-space: pre-wrap; color: var(--muted); font-size: 13px; }

  /* ── Narrow screens ───────────────────────────────────────── */
  @media (max-width: 680px) {
    :root { --ctrl-h: 84px; }

    body { overflow-x: hidden; }

    #controls {
      flex-wrap: wrap;
      height: auto;
      padding: 7px 10px;
      gap: 5px;
      align-content: center;
    }
    .ctrl-label { display: none; }
    .toolbar-sep { display: none; }
    #btn-toggle { min-width: 72px; font-size: 12px; padding: 5px 10px; }
    #speed-slider { width: 70px; }
    #speed-val { min-width: 2.2em; font-size: 12px; }
    .zoom-val { min-width: 2.6em; font-size: 12px; }
    .ctrl-btn { width: 32px; height: 32px; font-size: 13px; }

    /* TOC as slide-in overlay drawer */
    #toc-sidebar {
      width: 75%;
      max-width: 260px;
      transform: translateX(-100%);
      z-index: 200;
      box-shadow: 4px 0 20px rgba(0,0,0,0.7);
    }
    body.toc-on #toc-sidebar { transform: translateX(0); pointer-events: auto; }
    body.toc-on #toc-overlay { display: block; }

    #setlist-wrap {
      margin-left: 0;
      padding: calc(var(--ctrl-h) + 12px) 14px 40px;
    }
    body.toc-off #setlist-wrap { margin-left: 0; }

    .cm-song-content { overflow-x: auto; }
  }

  .transpose-control { font-size: 12px; color: var(--text); margin-left: auto; }
  #offline-status { font-size: 11px; }
  .ctrl-btn-wide { width: auto; padding: 0 8px; }
  #controls { flex-wrap: wrap; height: auto; min-height: 48px; padding-top: 7px; padding-bottom: 7px; }
  .song-block-header { flex-wrap: wrap; }
  .song-block { scroll-margin-top: calc(var(--nav-h) + var(--ctrl-h) + 12px); }
  /* ── Print ────────────────────────────────────────────────── */
  @media print {
    nav, #toc-sidebar, #controls, #toc-overlay, .transpose-control { display: none !important; }
    #setlist-wrap { margin: 0; padding: 0; }
    .song-block { page-break-inside: avoid; }
    @page { margin: 1.5cm 2cm; size: A4 portrait; }
  }
</style>

<div id="controls">
  <button id="btn-toc" title="Toggle song list" aria-label="Toggle song list" aria-controls="toc-sidebar" aria-expanded="false">☰</button>
  <div class="toolbar-sep"></div>
  <span id="tempo-blinker" title=""></span>
  <div class="toolbar-sep"></div>
  <button id="btn-toggle">▶ Play</button>
  <div class="toolbar-sep"></div>
  <span class="ctrl-label">Speed</span>
  <button class="ctrl-btn" id="btn-slower" aria-label="Scroll slower">−</button>
  <input type="range" id="speed-slider" aria-label="Autoscroll speed" min="0.2" max="8" step="0.1" value="1.5">
  <button class="ctrl-btn" id="btn-faster" aria-label="Scroll faster">+</button>

  <span class="zoom-val" id="zoom-val">14px</span>
  <button class="ctrl-btn" id="btn-zoom-in" aria-label="Increase chart size">+</button>

  <select id="sel-symbol" class="pref-select" title="Symbol type">

  <select id="sel-chart" class="pref-select" title="Chart type">

  <button class="ctrl-btn ctrl-btn-wide" id="btn-pdf" title="Print / Save as PDF">PDF</button>
