<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter&family=Montserrat&family=Nunito&family=Open+Sans&family=Roboto&display=swap" rel="stylesheet">
  <title>Setlists | SongHits</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0c0c0c;
      --surface: #111111;
      --border:  #222222;
      --text:    #cccccc;
      --muted:   #929292;
      --chord:   #fbbf24;
      --lyric:   #a6bac9;
      --section: #4ade80;
      --red:     #f87171;
      --blue:    #60a5fa;
      --nav-h:   44px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Verdana, Geneva, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 500;
      height: var(--nav-h);
      background: #080808;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 20px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .nav-brand { color: var(--red); font-weight: 700; letter-spacing: 0.06em; font-size: 14px; }
    nav a { color: var(--muted); }
    nav a:hover { color: var(--text); text-decoration: none; }

    /* ── chord-mark renderer output ─────────────────────────── */
    .cmSong {
      max-width: 900px;
      line-height: 1;
      font-family: var(--chart-font, 'Courier New', Courier, monospace);
    }
    .cmSection { margin-bottom: 1.2em; }

    .cmSectionLabel {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--section);
      margin: 0 0 5px;
      padding-bottom: 2px;
      border-bottom: 1px solid #282828;
    }
    .cmSectionMultiplier { color: #c678dd; font-weight: normal; }

    .cmTimeSignature,
    .cmKeyDeclaration { color: #56b6c2; font-weight: bold; margin-bottom: 4px; display: block; }

    .cmChordLine {
      display: block;
      white-space: pre;
      color: var(--chord);
      font-weight: 600;
      line-height: 1;
    }
    .cmChordSymbol { color: var(--chord); }
    .cmChordDuration { color: #555; font-weight: normal; font-size: 0.85em; }
    .cmBarSeparator { color: #333; opacity: 0.9; }
    .cmSubBeatGroupOpener,
    .cmSubBeatGroupCloser { color: #888; font-weight: bold; }

    .cmLyricLine {
      display: block;
      white-space: pre;
      color: var(--lyric);
      line-height: 1;
    }
    .cmLyric { display: inline; }

    .cmNoChord { color: var(--muted); font-style: italic; }
    .cmEmptyLine { display: block; height: 0.55em; }

    /* ── Shared button/control styles ───────────────────────── */
    .ctrl-btn {
      background: #1e1e1e;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 4px;
      width: 26px;
      height: 26px;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
      transition: background 0.1s;
    }
    .ctrl-btn:hover { background: #2a2a2a; color: #fff; }
    .ctrl-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      flex-shrink: 0;
    }
    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }
    .pref-select {
      background: #1e1e1e;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 11px;
      height: 26px;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }
    .pref-select:hover, .pref-select:focus { background: #2a2a2a; color: #fff; }

    /* ── Tempo blinker ──────────────────────────────────────── */
    @keyframes tempo-pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(0.38); }
    }
    #tempo-blinker {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--chord);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.4s;
      animation: tempo-pulse 0.5s ease-in-out infinite;
      animation-play-state: paused;
    }
    #tempo-blinker.active {
      opacity: 1;
      animation-play-state: running;
    }

    /* ── Autoscroll playhead ───────────────────────────────── */
    .cmLine.cm-playhead { position: relative; background: rgba(74, 222, 128, 0.07); }
    .cmLine.cm-playhead::before {
      content: ''; position: absolute; left: -10px; top: 0; bottom: 0;
      width: 3px; border-radius: 2px; background: var(--section);
    }
    button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    button:disabled { opacity: 0.45; cursor: default; }
    @media print {
      :root { --bg: #fff; --text: #111; --muted: #444; --chord: #111; --lyric: #111; --section: #222; --red: #111; }
      body { background: #fff; color: #111; }
      .cmBarSeparator { color: #555; opacity: 1; }
      .cmChordDuration { color: #444; }
      .cmLyricLine { white-space: pre-wrap; }
    }
  </style>
</head>
